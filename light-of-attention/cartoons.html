    const grid = document.getElementById("cartoon-grid");

    cartoonFiles.forEach((file, index) => {
      const link = document.createElement("a");
      link.className = "cartoon-tile";
      link.href = encodeMediaPath("cartoons", file);
      link.target = "_blank";
      link.rel = "noopener";

      const img = document.createElement("img");
      img.src = encodeMediaPath("cartoons", file);
      img.alt = `Cartoon ${index + 1}`;
      img.loading = "lazy";

      link.appendChild(img);
